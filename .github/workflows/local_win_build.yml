name: Local Windows Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.5.3
      QT_DIR: C:\Qt\6.5.3\msvc2019_64
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_TYPE: Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Setup Visual Studio 2019
      uses: microsoft/setup-msbuild@v1
      with:
        vs-version: '16.11.25' # VS2019

    - name: Setup Qt
      uses: jurplel/install-qt-action@v2
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2019_64
        dir: ${{ env.QT_DIR }}
        modules: widgets

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.26.4'

    - name: Install Ninja
      run: choco install ninja -y

    - name: Install Python dependencies
      run: pip install pyzstd --only-binary :all:

    - name: Configure CMake
      run: |
        cmake -S . -B build -G ${{ env.CMAKE_GENERATOR }} ^
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} ^
          -DCMAKE_PREFIX_PATH=${{ env.QT_DIR }}

    - name: Build project
      run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }}

    - name: Run executable
      run: build\QtNinjaSample.exe
